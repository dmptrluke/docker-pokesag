# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
exclude: 'node_modules|build|dist|.git|.pytest_cache'
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml
    -   id: check-json
    -   id: check-ast
    -   id: check-merge-conflict
    -   id: check-builtin-literals
    -   id: check-added-large-files
        args: ['--maxkb=1024']

-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.5
    hooks:
    -   id: ruff
        args: [--fix]
        files: ^receiver/.*\.py$
    -   id: ruff-format
        files: ^receiver/.*\.py$

-   repo: local
    hooks:
    -   id: biome-check
        name: biome check
        entry: bash -c 'cd web && npx biome check --no-errors-on-unmatched "$@"' --
        language: system
        files: '^web/.*\.(jsx?|mjs)$'
