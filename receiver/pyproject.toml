[project]
name = "pokesag-receiver"
version = "1.2.0"
requires-python = ">=3.11"
dependencies = [
    "environs",
    "psycopg[binary]",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "UP",        # pyupgrade
    "A",         # flake8-builtins
    "B",         # flake8-bugbear
    "C4",        # flake8-comprehensions
    "SIM",       # flake8-simplify
    "RUF",       # ruff-specific
    "PIE",       # flake8-pie
]
ignore = [
    "SIM103",  # return condition directly
    "SIM108",  # ternary operator
]

[tool.ruff.format]
quote-style = "single"
